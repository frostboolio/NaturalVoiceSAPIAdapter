name: WoW x64 compatibility build

on:
  push:
    branches: ["agent/wow-edge-no-boundary"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ATL and add MSBuild to PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $install) { throw "Visual Studio with MSBuild was not found" }
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\setup.exe"
          & $vsInstaller modify --installPath $install --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart
          if ($LASTEXITCODE -ne 0) { throw "ATL installation failed with exit code $LASTEXITCODE" }
          "$install\MSBuild\Current\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore packages
        run: nuget restore NaturalVoiceSAPIAdapter -SolutionDirectory .

      - name: Build x64 DLL
        run: msbuild /m /p:Configuration=Release /p:Platform=x64 /p:OutDir=${{github.workspace}}\out\ . /t:NaturalVoiceSAPIAdapter

      - name: Upload x64 result
        uses: actions/upload-artifact@v4
        with:
          name: NaturalVoiceSAPIAdapter-WoW-x64
          path: |
            out/NaturalVoiceSAPIAdapter.dll
            out/*.pdb
