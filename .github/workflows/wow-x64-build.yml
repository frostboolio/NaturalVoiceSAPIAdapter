name: WoW x64 compatibility build

on:
  push:
    branches: ["agent/wow-edge-no-boundary"]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ATL and add MSBuild to PATH
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $install = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -property installationPath
          if (-not $install) { throw "Visual Studio with MSBuild was not found" }
          $vsInstaller = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vs_installer.exe"
          $arguments = "modify --installPath `"$install`" --add Microsoft.VisualStudio.Component.VC.ATL --quiet --norestart"
          $process = Start-Process -FilePath $vsInstaller -ArgumentList $arguments -Wait -PassThru
          if ($process.ExitCode -notin 0, 3010) { throw "ATL installation failed with exit code $($process.ExitCode)" }
          $atlHeader = Get-ChildItem -Path "$install\VC\Tools\MSVC\*\atlmfc\include\atlbase.h" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $atlHeader) { throw "ATL installation completed but atlbase.h was not found" }
          Write-Host "ATL header found: $($atlHeader.FullName)"
          "$install\MSBuild\Current\Bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Restore packages
        run: nuget restore NaturalVoiceSAPIAdapter -SolutionDirectory .

      - name: Build x64 DLL
        run: msbuild /m /p:Configuration=Release /p:Platform=x64 /p:OutDir=${{github.workspace}}\out\ . /t:NaturalVoiceSAPIAdapter

      - name: Upload x64 result
        uses: actions/upload-artifact@v4
        with:
          name: NaturalVoiceSAPIAdapter-WoW-x64
          path: |
            out/NaturalVoiceSAPIAdapter.dll
            out/*.pdb
